# Conda environment for the Docker image. conda-forge is the reliable way to get
# the ecCodes C library (for NBM GRIB2 decoding) plus the GDAL/GEOS/PROJ stack.
# scikit-learn and numpy are pinned to the versions the .pkl models were trained
# with so the deployed predictions match local testing exactly.
name: base
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26
  - scikit-learn=1.3.2
  - flask
  - gunicorn
  - matplotlib-base
  - rasterio
  - geopandas
  - shapely
  - pyproj
  - python-eccodes
  - cfgrib
  - xarray
  - requests

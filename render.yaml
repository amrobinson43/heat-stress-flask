# Render Blueprint (Free tier). In the Render dashboard: New + -> Blueprint,
# point it at this repo, Apply. Or create a Web Service manually with
# Runtime = Docker, plan Free, and the env vars below.
#
# Free notes: no card required, no persistent disk, and the service sleeps after
# ~15 min idle -> the next visitor waits while it wakes and rebuilds the forecast
# (a few minutes on the 0.1 CPU free instance). The cache lives on the ephemeral
# container filesystem (rebuilt on each wake). For an always-on, instant tool,
# switch plan to `starter` and add a disk (see git history of this file).
#
# The service name is intentionally NOT "heat-stress-flask" so this does not
# collide with the existing Python service of that name. Verify this one at
# https://heat-stress-flask-nbm.onrender.com, then rename/swap to take the
# original URL if you want it.
services:
  - type: web
    name: heat-stress-flask-nbm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: WBGT_STRIDE          # 1 = full resolution
        value: "1"
      - key: WBGT_FCST_DAYS
        value: "3"
      - key: WBGT_UNITS           # default display unit for the toggle
        value: "F"
      - key: WBGT_RUN_TTL         # re-check for a newer NBM run every 6 h
        value: "21600"
      - key: PYTHONUNBUFFERED
        value: "1"
